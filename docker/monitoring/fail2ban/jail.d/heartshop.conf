# HeartShop Fail2Ban Jail Configuration

[DEFAULT]
bantime = 3600
findtime = 600
maxretry = 5
banaction = iptables-multiport

# HeartShop API abuse
[heartshop-api]
enabled = true
filter = heartshop-api
logpath = /var/log/heartshop/*.log
maxretry = 10
findtime = 60
bantime = 7200
action = iptables-multiport[name=heartshop-api, port="80,443,3001"]

# HeartShop authentication failures
[heartshop-auth]
enabled = true
filter = heartshop-auth
logpath = /var/log/heartshop/*.log
maxretry = 5
findtime = 300
bantime = 86400
action = iptables-multiport[name=heartshop-auth, port="80,443,3001"]

# HeartShop SQL injection attempts
[heartshop-sqli]
enabled = true
filter = heartshop-sqli
logpath = /var/log/heartshop/*.log
maxretry = 1
findtime = 60
bantime = 604800
action = iptables-multiport[name=heartshop-sqli, port="80,443,3001"]

# HeartShop plugin API abuse
[heartshop-plugin]
enabled = true
filter = heartshop-plugin
logpath = /var/log/heartshop/*.log
maxretry = 100
findtime = 60
bantime = 3600
action = iptables-multiport[name=heartshop-plugin, port="80,443,3001"]
