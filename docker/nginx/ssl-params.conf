# HeartShop SSL/TLS Security Parameters
# Maximum security configuration for TLS 1.3

# SSL/TLS Protocol versions - TLS 1.3 only for maximum security
ssl_protocols TLSv1.3;

# TLS 1.3 cipher suites (automatic with TLS 1.3)
ssl_prefer_server_ciphers off;

# ECDH curve
ssl_ecdh_curve secp384r1;

# Session settings
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# OCSP Stapling (disabled - requires valid CA-signed certificate)
# ssl_stapling on;
# ssl_stapling_verify on;
# resolver 8.8.8.8 8.8.4.4 valid=300s;
# resolver_timeout 5s;

# DH parameters - not needed for TLS 1.3 (uses ECDHE only)
# ssl_dhparam /etc/nginx/certs/nginx/dhparam.pem;

# Buffer size
ssl_buffer_size 4k;
