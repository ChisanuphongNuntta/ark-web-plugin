# HeartShop Nginx Configuration
# Maximum security with TLS 1.3, HSTS, and security headers

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security info
    log_format security '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '$request_time $upstream_response_time '
                       '$ssl_protocol $ssl_cipher '
                       'req_id=$request_id';

    access_log /var/log/nginx/access.log security;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security - Hide version
    server_tokens off;
    # more_clear_headers Server;

    # Buffer sizes
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 10M;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=plugin_limit:10m rate=4r/s;
    # HTTP/2 counts each concurrent request as a connection. A cold Next.js
    # page loads more than20 chunks; counting those rejects its own hydration.
    # Only static assets bypass this quota; API/page limits stay. /images/ and /audio/ are
    # added because a shop page loads ~24 thumbnails at once and the surplus got a 503.
    map $uri $app_connection_key {
        default $binary_remote_addr;
        ~^/_next/static/ "";
        ~^/images/ "";
        ~^/audio/ "";
    }
    limit_conn_zone $app_connection_key zone=app_conn_limit:10m;

    # Connection limits
    limit_conn app_conn_limit 20;

    # Upstream backends with health checks
    # Docker's embedded DNS. With 'resolve' below, nginx follows container IP changes
    # after a recreate instead of pinning the IP it saw at startup (which caused 502s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream backend_api {
        zone backend_api 64k;
        least_conn;
        server backend:3001 max_fails=3 fail_timeout=30s resolve;
        keepalive 32;
    }

    upstream plugin_gateway {
        zone plugin_gateway 64k;
        server plugin-gateway:3001 max_fails=3 fail_timeout=30s resolve;
        keepalive 16;
    }

    upstream frontend_app {
        zone frontend_app 64k;
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s resolve;
        keepalive 16;
    }

    # Include SSL parameters
    include /etc/nginx/ssl-params.conf;

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
