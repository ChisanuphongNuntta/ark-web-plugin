# HeartShop PostgreSQL Host-Based Authentication
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections - trust for postgres superuser only
local   all             postgres                                peer

# TLS and SCRAM are mandatory for every TCP client, including replication.
hostssl replication     all             0.0.0.0/0               scram-sha-256
hostssl replication     all             ::/0                    scram-sha-256
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256

# Local connections
local   all             all                                     scram-sha-256
