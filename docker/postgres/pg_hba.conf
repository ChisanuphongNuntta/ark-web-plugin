# HeartShop PostgreSQL Host-Based Authentication
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections - trust for postgres superuser only
local   all             postgres                                peer

# SSL required for all remote connections
# Allow password authentication for all connections (internal Docker network)
# Security relies on Docker network isolation and strong passwords
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

# Local connections
local   all             all                                     md5
