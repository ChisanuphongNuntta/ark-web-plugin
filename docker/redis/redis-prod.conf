# HeartShop Redis Production Configuration
# Secure configuration with TLS

################################## NETWORK #####################################

bind 0.0.0.0
port 6379
# tls-port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

################################## TLS/SSL #####################################
# TLS disabled for localhost deployment
# Enable for production with proper CA-signed certs
# tls-cert-file /etc/redis/certs/redis.crt
# tls-key-file /etc/redis/certs/redis.key
# tls-ca-cert-file /etc/redis/certs/ca.crt
# tls-auth-clients yes
# tls-protocols "TLSv1.3"
# tls-ciphers DEFAULT:!MEDIUM
# tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
# tls-prefer-server-ciphers yes
# tls-session-caching yes
# tls-session-cache-size 20480
# tls-session-cache-timeout 300
# tls-replication yes
# tls-cluster yes

################################## SECURITY ####################################

# Require password
requirepass heartshop_redis_secure

# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "HEARTSHOP_CONFIG_a8f3b2c1"
rename-command SHUTDOWN "HEARTSHOP_SHUTDOWN_d4e5f6a7"
rename-command SLAVEOF ""
rename-command REPLICAOF ""

# ACL (Access Control List)
acllog-max-len 128

################################## MEMORY #####################################

maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

################################## PERSISTENCE ################################

# RDB
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

################################## LOGGING ####################################

loglevel notice
logfile ""
syslog-enabled no

################################## REPLICATION ################################

replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 1mb
repl-backlog-ttl 3600

################################## SLOW LOG ###################################

slowlog-log-slower-than 10000
slowlog-max-len 128

################################## CLIENTS ####################################

maxclients 10000

################################## MISC #######################################

# Disable dangerous features
enable-debug-command no
lua-replicate-commands yes
