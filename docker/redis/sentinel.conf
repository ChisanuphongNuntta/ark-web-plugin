# HeartShop optional Redis Sentinel configuration
# Dormant until a real multi-node HA topology is provisioned.

port 0
tls-port 26379
tls-cert-file /etc/redis/certs/redis.crt
tls-key-file /etc/redis/certs/redis.key
tls-ca-cert-file /etc/redis/certs/ca.crt
tls-auth-clients no
tls-replication yes

# Allow hostname resolution (needed for Docker container names)
SENTINEL resolve-hostnames yes
SENTINEL announce-hostnames yes

# Monitor the primary instance
sentinel monitor heartshop-master redis-primary 6379 1

# Failover settings
sentinel down-after-milliseconds heartshop-master 5000
sentinel parallel-syncs heartshop-master 1
sentinel failover-timeout heartshop-master 60000

# Deny dangerous commands
sentinel deny-scripts-reconfig yes

# Logging
loglevel notice
logfile ""
