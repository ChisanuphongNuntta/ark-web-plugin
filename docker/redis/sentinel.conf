# HeartShop Redis Sentinel Configuration
# Plain port (TLS matches redis-prod.conf which has TLS commented out)

port 26379

# Allow hostname resolution (needed for Docker container names)
SENTINEL resolve-hostnames yes
SENTINEL announce-hostnames yes

# Monitor the primary instance
sentinel monitor heartshop-master redis-primary 6379 2
sentinel auth-pass heartshop-master heartshop_redis_secure

# Failover settings
sentinel down-after-milliseconds heartshop-master 5000
sentinel parallel-syncs heartshop-master 1
sentinel failover-timeout heartshop-master 60000

# Deny dangerous commands
sentinel deny-scripts-reconfig yes

# Logging
loglevel notice
logfile ""
