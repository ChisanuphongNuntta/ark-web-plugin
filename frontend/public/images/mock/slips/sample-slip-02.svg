<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="scbSlipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="100%" stop-color="#0B0515"/>
    </linearGradient>
    <linearGradient id="scbPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E2A84"/>
      <stop offset="100%" stop-color="#7B42BC"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="600" rx="20" fill="url(#scbSlipBg)" stroke="#A77BFF" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="360" height="60" rx="12" fill="url(#scbPurple)"/>
  <text x="40" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" letter-spacing="1">SCB EASY SLIP</text>
  <text x="360" y="55" text-anchor="end" fill="#F0E8FF" font-family="monospace" font-size="12">ทำรายการสำเร็จ</text>

  <!-- Amount Area -->
  <rect x="20" y="95" width="360" height="110" rx="12" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="200" y="135" text-anchor="middle" fill="#A89BB5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">จำนวนเงินโอน (THB)</text>
  <text x="200" y="180" text-anchor="middle" fill="#A77BFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">฿ 1,299.00</text>

  <!-- Transaction Details -->
  <g transform="translate(35, 235)" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">
    <text x="0" y="0" fill="#7D6F8A" font-weight="600">จากบัญชี:</text>
    <text x="330" y="0" text-anchor="end" font-weight="700">น.ส. อรอุมา xxx-x-x5541-x</text>

    <text x="0" y="35" fill="#7D6F8A" font-weight="600">ไปยังบัญชี:</text>
    <text x="330" y="35" text-anchor="end" font-weight="700" fill="#37E5D2">IRIS EXPEDITION CO., LTD.</text>

    <text x="0" y="70" fill="#7D6F8A" font-weight="600">ธนาคารปลายทาง:</text>
    <text x="330" y="70" text-anchor="end" font-weight="700">ไทยพาณิชย์ (SCB)</text>

    <text x="0" y="105" fill="#7D6F8A" font-weight="600">เลขที่อ้างอิง:</text>
    <text x="330" y="105" text-anchor="end" font-family="monospace" font-weight="700" fill="#DDBB72">SCB-E-SLIP-554109</text>

    <text x="0" y="140" fill="#7D6F8A" font-weight="600">วัน-เวลาที่ทำรายการ:</text>
    <text x="330" y="140" text-anchor="end" font-weight="700">15 ส.ค. 2026, 19:15 น.</text>

    <text x="0" y="175" fill="#7D6F8A" font-weight="600">รหัสตรวจสอบ QR:</text>
    <text x="330" y="175" text-anchor="end" font-family="monospace" fill="#A89BB5">01400002008554109</text>
  </g>

  <!-- QR Code Mock box -->
  <rect x="140" y="445" width="120" height="120" rx="10" fill="#FFFFFF"/>
  <rect x="150" y="455" width="30" height="30" fill="#000000"/>
  <rect x="220" y="455" width="30" height="30" fill="#000000"/>
  <rect x="150" y="525" width="30" height="30" fill="#000000"/>
  <rect x="190" y="490" width="20" height="20" fill="#000000"/>
  <text x="200" y="582" text-anchor="middle" fill="#6A5A7A" font-family="system-ui, sans-serif" font-size="10">สแกนตรวจสอบสลิปแท้ 100%</text>
