<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">IRIS item placeholder</title>
  <desc id="desc">Luxury cyan and gold abstract game item capsule.</desc>
  <defs>
