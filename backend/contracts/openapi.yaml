openapi: 3.1.0
info:
  title: IRIS Enterprise Commerce API
  version: 0.1.0
  description: Source-of-truth contract owned by the backend team.
servers:
  - url: /api
paths:
  /wallet:
    get:
      operationId: getWalletBalance
      tags: [Wallet]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Wallet balances. Integer amounts are strings to avoid precision loss.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /wallet/transactions:
    get:
      operationId: listWalletTransactions
      tags: [Wallet]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Immutable transaction history scoped to the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [transactions, pagination]
                properties:
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerTransaction' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: User profile and linked identities.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/identities:
    get:
      operationId: getLinkedIdentities
      tags: [Auth]
      description: >-
        IRIS ID linked-providers view for the Account Center. Reports every provider (discord,
        steam, epic); unlinked providers appear with null fields and `canUnlink: false`.
        `canUnlink` enforces the invariant that at least one provider must remain linked.
        Mirrors `contracts/fixtures/linked-identities.json`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Linked identities and IRIS ID linking rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkedIdentitiesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/link-steam:
    post:
      operationId: linkSteam
      tags: [Auth]
      description: >-
        Link a Steam identity to the authenticated IRIS ID. Linking requires
        proof-of-control of the provider (Steam OpenID assertion verified server-side or via
        the provider callback). IRIS ID NEVER auto-merges accounts by email or display name.
        `proof` is optional in development (the verified callback cookie is used) but REQUIRED
        in production.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steamId]
              properties:
                steamId: { type: string }
                proof: { $ref: '#/components/schemas/LinkProof' }
      responses:
        '200':
          description: Steam account linked successfully.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/unlink-steam:
    post:
      operationId: unlinkSteam
      tags: [Auth]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Steam account unlinked successfully.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/link-epic:
    post:
      operationId: linkEpic
      tags: [Auth]
      description: >-
        Link an Epic Games identity to the authenticated IRIS ID. Requires proof-of-control
        of the provider (Epic OAuth verified server-side). IRIS ID NEVER auto-merges accounts
        by email or display name. `proof` is optional in development but REQUIRED in production.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [epicId]
              properties:
                epicId: { type: string }
                proof: { $ref: '#/components/schemas/LinkProof' }
      responses:
        '200':
          description: Epic Games account linked successfully.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/unlink-epic:
    post:
      operationId: unlinkEpic
      tags: [Auth]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Epic Games account unlinked successfully.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/unlink-discord:
    post:
      operationId: unlinkDiscord
      tags: [Auth]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Discord account unlinked successfully.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions:
    get:
      operationId: listSessions
      tags: [Auth]
      description: >-
        Active device sessions for the user. Each item carries risk-based login flags derived
        from the requesting device: `isCurrent`, `riskFlag` (true on a new IP/device), and
        `riskReasons`. The frontend can surface a security prompt for any flagged session.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Active sessions for the user, with derived risk flags.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionWithRisk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [Auth]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Session revoked successfully.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/recovery:
    post:
      operationId: requestRecovery
      tags: [Auth]
      description: >-
        Start an account recovery. STUB: schema-complete, provider proof verification lands in
        a later milestone. Recovery is ALWAYS a proof-of-control challenge against a still-linked
        provider; accounts are never recovered or merged by email/display name. The endpoint is
        intentionally non-enumerating (it does not confirm whether an account exists).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryRequest' }
      responses:
        '202':
          description: Recovery ticket accepted; proof-of-control required to continue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /plugin/heartbeat:
    post:
      operationId: pluginHeartbeat
      tags: [Plugin]
      security: [{ hmacAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
      responses:
        '200':
          description: Heartbeat received.
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plugin/deliveries/claim:
    post:
      operationId: claimDeliveries
      tags: [Plugin]
      security: [{ hmacAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverId]
              properties:
                serverId: { type: integer }
      responses:
        '200':
          description: List of claimed delivery jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeliveryJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plugin/deliveries/{deliveryKey}/complete:
    post:
      operationId: completeDelivery
      tags: [Plugin]
      security: [{ hmacAuth: [] }]
      parameters:
        - { in: path, name: deliveryKey, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryReceipt' }
      responses:
        '200':
          description: Delivery marked as completed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugin/deliveries/{deliveryKey}/fail:
    post:
      operationId: failDelivery
      tags: [Plugin]
      security: [{ hmacAuth: [] }]
      parameters:
        - { in: path, name: deliveryKey, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseToken, error]
              properties:
                leaseToken: { type: string }
                error: { type: string }
      responses:
        '200':
          description: Delivery marked as failed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugin/deliveries/{deliveryKey}/release:
    post:
      operationId: releaseDelivery
      tags: [Plugin]
      security: [{ hmacAuth: [] }]
      parameters:
        - { in: path, name: deliveryKey, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseToken]
              properties:
                leaseToken: { type: string }
      responses:
        '200':
          description: Delivery lease released back to the queue.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugin/market/prepare-lock:
    post:
      operationId: prepareLock
      tags: [Plugin]
      security: [{ hmacAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [species, level, sellerSteamId]
              properties:
                species: { type: string }
                level: { type: integer }
                sellerSteamId: { type: string }
      responses:
        '200':
          description: Lock prepared.
          content:
            application/json:
              schema:
                type: object
                required: [assetLockId, expiresAt]
                properties:
                  assetLockId: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plugin/market/confirm-lock:
    post:
      operationId: confirmLock
      tags: [Plugin]
      security: [{ hmacAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetLockId, assetFingerprint, price]
              properties:
                assetLockId: { type: string }
                assetFingerprint: { type: string }
                price: { type: integer }
      responses:
        '200':
          description: Lock confirmed and listing created.
          content:
            application/json:
              schema:
                type: object
                required: [success, listingId]
                properties:
                  success: { type: boolean }
                  listingId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plugin/player/{steamId}/wallet:
    get:
      operationId: getPlayerWallet
      tags: [Plugin]
      description: >-
        Read-only IRIS Wallet balance for a linked player, for the in-game `/iris` companion
        (CR-PLUGIN-007). Server-scoped: the steamId MUST be linked to an IRIS account and
        associated with the calling credential's server, else 403/404. Amounts are decimal
        strings. Signed with `hmacAuth`.
      security: [{ hmacAuth: [] }]
      parameters:
        - { in: path, name: steamId, required: true, schema: { type: string } }
      responses:
        '200':
          description: Wallet balances for the player (decimal strings).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugin/player/{steamId}/pending-deliveries:
    get:
      operationId: getPlayerPendingDeliveries
      tags: [Plugin]
      description: >-
        Count of not-yet-completed delivery jobs for a linked player on the calling credential's
        server (CR-PLUGIN-007). Server-scoped and read-only. Signed with `hmacAuth`.
      security: [{ hmacAuth: [] }]
      parameters:
        - { in: path, name: steamId, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pending delivery count for the player on this server.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugin/wallet/events:
    get:
      operationId: getWalletEvents
      tags: [Plugin]
      description: >-
        Server-scoped wallet event feed for the in-game companion (CR-PLUGIN-008). Returns
        `wallet.transaction.posted` events (see contracts/events) for players associated with the
        calling credential's server, with ADDITIVE `playerSteamId` + `userId` attribution fields.
        Cursor pagination: pass the previous `lastTimestamp` as `?since=`. Read-only, signed with
        `hmacAuth`.
      security: [{ hmacAuth: [] }]
      parameters:
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
          description: Return events strictly after this timestamp (the previous response's lastTimestamp).
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: A page of wallet events plus the cursor to resume from.
          content:
            application/json:
              schema:
                type: object
                required: [success, events, lastTimestamp]
                properties:
                  success: { type: boolean }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/WalletEvent' }
                  lastTimestamp: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plugin/verify:
    get:
      operationId: pluginVerifyLicense
      tags: [Plugin]
      description: >-
        Legacy plugin license verification + IP registration (CR-PLUGIN-006). The migration
        target is `hmacAuth`; `legacyApiKeyAuth` (X-API-Key) is accepted during the overlap window
        and logged as a deprecation.
      security: [{ hmacAuth: [] }, { legacyApiKeyAuth: [] }]
      responses:
        '200': { description: License verified. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plugin/orders/pending:
    get:
      operationId: pluginGetPendingOrders
      tags: [Plugin]
      description: 'Legacy pending-orders poll (CR-PLUGIN-006). hmacAuth target; X-API-Key accepted during overlap.'
      security: [{ hmacAuth: [] }, { legacyApiKeyAuth: [] }]
      responses:
        '200': { description: Pending orders for this server. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plugin/stats:
    post:
      operationId: pluginUpdatePlayerStats
      tags: [Plugin]
      description: 'Legacy player-stats upsert (CR-PLUGIN-006). hmacAuth target; X-API-Key accepted during overlap.'
      security: [{ hmacAuth: [] }, { legacyApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [players]
              properties:
                players: { type: array, items: { type: object } }
      responses:
        '200': { description: Stats processed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plugin/player/{steamId}:
    get:
      operationId: pluginGetPlayerBySteamId
      tags: [Plugin]
      description: >-
        Legacy player lookup by Steam ID (CR-PLUGIN-006). hmacAuth target; X-API-Key accepted
        during overlap. NOTE: this is distinct from the read-only companion routes
        `/plugin/player/{steamId}/wallet` and `/plugin/player/{steamId}/pending-deliveries`.
      security: [{ hmacAuth: [] }, { legacyApiKeyAuth: [] }]
      parameters:
        - { in: path, name: steamId, required: true, schema: { type: string } }
      responses:
        '200': { description: Player info + pending order count. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart:
    get:
      operationId: getCart
      tags: [Cart]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: User's shopping cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cart/items:
    post:
      operationId: addToCart
      tags: [Cart]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, serverId]
              properties:
                productId: { type: integer }
                serverId: { type: integer }
                quantity: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateCartItem
      tags: [Cart]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, serverId, quantity]
              properties:
                productId: { type: integer }
                serverId: { type: integer }
                quantity: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: removeFromCart
      tags: [Cart]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, serverId]
              properties:
                productId: { type: integer }
                serverId: { type: integer }
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /checkout/session:
    post:
      operationId: createCheckoutSession
      tags: [Checkout]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: { type: string }
      responses:
        '200':
          description: Created checkout session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /checkout/session/{id}/commit:
    post:
      operationId: commitCheckoutSession
      tags: [Checkout]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Checkout session committed and paid. Orders created and deliveries queued.
          content:
            application/json:
              schema:
                type: object
                required: [success, orderIds, totalSpent]
                properties:
                  success: { type: boolean }
                  orderIds:
                    type: array
                    items: { type: string }
                  totalSpent: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/BadRequest' }
  /products:
    get:
      operationId: listProducts
      tags: [Catalog]
      description: Public product catalog. Only active products are returned. price is an integer Iris Coin amount.
      parameters:
        - { in: query, name: categoryId, schema: { type: integer } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: minPrice, schema: { type: integer, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: integer, minimum: 0 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated list of active products.
          content:
            application/json:
              schema:
                type: object
                required: [products, pagination]
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [Catalog]
      description: Up to 10 active, featured products for the home/discover surface.
      responses:
        '200':
          description: Featured products (no pagination).
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
  /products/categories:
    get:
      operationId: listCategories
      tags: [Catalog]
      description: Active categories with active-product counts, ordered by sortOrder.
      responses:
        '200':
          description: Category list.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /products/{id}:
    get:
      operationId: getProductById
      tags: [Catalog]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: A single active product.
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
  /servers:
    get:
      operationId: listServers
      tags: [Catalog]
      description: >-
        Public-safe server directory for server-selection and live-status surfaces.
        Secrets (apiKey, webhookUrl) are never exposed. isOnline is a DERIVED field:
        true when lastHeartbeat is within the freshness window, otherwise false.
        playerCount/maxPlayers/mode are NOT yet produced by the backend and must not
        be relied upon until a future contract version adds them.
      responses:
        '200':
          description: Public server list.
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items: { $ref: '#/components/schemas/ServerStatus' }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    legacyApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        DEPRECATED legacy plugin auth (per-user API key + X-Server-Id + IP whitelist). Accepted
        ONLY during the CR-PLUGIN-006 migration overlap window so plugins already in the field do
        not break; each use is logged as a deprecation. New deployments MUST use `hmacAuth`. Will
        be removed once all servers have migrated to signed requests.
    hmacAuth:
      type: apiKey
      in: header
      name: X-Signature
      description: >-
        Signed plugin request authentication (HMAC-SHA256). The signature is carried in
        `X-Signature` and is computed over a canonical string with the per-credential HMAC
        secret. The signing IDENTITY and the signing SECRET are two distinct values:


        Headers (all required):

        - `X-Plugin-Key-Id`: the credential identifier. It IDENTIFIES which signing secret to
          use; it is NOT itself the secret and is safe to log. It is rotatable and revocable
          independently of the secret.

        - `X-Plugin-Version`: plugin build/version string (compatibility + telemetry).

        - `X-Request-Timestamp`: unix epoch milliseconds. Requests outside the clock-skew
          window (+/- 5 minutes / 300000 ms) are rejected.

        - `X-Request-Nonce`: >= 16 chars, single-use; replays within the skew window are
          rejected (nonce cache).

        - `X-Content-Sha256`: hex SHA-256 of the exact JSON request body ('' when no body).

        - `X-Signature`: `HMAC_SHA256(secret, canonicalString)` as lowercase hex, where
          `canonicalString = METHOD \n PATH_AND_QUERY \n TIMESTAMP \n NONCE \n CONTENT_SHA256`.

        - `X-Server-Id`: target server id (also accepted via `?serverId=` or body.serverId).


        Key id vs secret (issuance / rotation):

        - Each server credential is issued as a pair `{ keyId, secret }`. The plugin stores the
          secret securely and sends only `keyId` on the wire (in `X-Plugin-Key-Id`); the secret
          is never transmitted.

        - The backend resolves `keyId -> secret` server-side to verify `X-Signature`.

        - Rotation: a new `{ keyId, secret }` may be issued and the plugin switches to the new
          keyId; the previous keyId can be revoked without changing any other credential. During
          an overlap window both keyIds may be valid to allow zero-downtime rotation.

        - Clock skew: verifiers must allow +/- 300000 ms drift on `X-Request-Timestamp`.

        - Server scope: a resolved credential is bound to the server it was issued for. Its scope
          is fixed to that `serverId`; an `X-Server-Id` (or body/query serverId) that disagrees is
          rejected (403). Issue/rotate/revoke pairs via `scripts/issue-plugin-credential.ts`.

        Live verifier: the middleware resolves `X-Plugin-Key-Id` -> the per-credential HMAC
        secret (stored encrypted-at-rest) and verifies `X-Signature` against that resolved
        secret — NOT against the keyId. During the rotation/overlap window a legacy plugin that
        has not yet migrated to an issued `{ keyId, secret }` pair is still accepted by falling
        back to the legacy `X-API-Key` value as the HMAC secret (logged as a deprecation); new
        deployments must use issued credentials.
  responses:
    Unauthorized:
      description: Authentication required
    BadRequest:
      description: Invalid request parameters or state conflict
    Forbidden:
      description: Authenticated but not permitted (e.g. out of server/credential scope)
    NotFound:
      description: Resource not found
  schemas:
    User:
      type: object
      required: [id, discordId, pointsBalance, role, createdAt]
      properties:
        id: { type: string }
        steamId: { type: [string, 'null'] }
        epicId: { type: [string, 'null'] }
        discordId: { type: string }
        discordUsername: { type: [string, 'null'] }
        discordAvatar: { type: [string, 'null'] }
        pointsBalance: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
    UserSession:
      type: object
      required: [id, token, expiresAt, createdAt]
      properties:
        id: { type: string }
        token: { type: string }
        ipAddress: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    SessionWithRisk:
      allOf:
        - { $ref: '#/components/schemas/UserSession' }
        - type: object
          required: [isCurrent, riskFlag, riskReasons]
          properties:
            isCurrent:
              type: boolean
              description: True when this session matches the requesting device's IP and user-agent.
            riskFlag:
              type: boolean
              description: Risk-based login flag — true when a non-current session is on a new IP or new device.
            riskReasons:
              type: array
              items: { type: string, enum: [new_ip, new_device] }
    LinkProof:
      type: object
      description: >-
        Proof-of-control material for account linking. `method` declares how control was
        proven. email/name/username are explicitly rejected — IRIS ID never merges by identity
        attributes. Method-specific verified fields (e.g. claimedId, verified token reference)
        may accompany `method` as additional properties.
      required: [method]
      properties:
        method:
          type: string
          enum: [steam_openid, epic_oauth, discord_oauth, provider_callback]
      additionalProperties: true
    LinkedIdentity:
      type: object
      required: [provider, providerAccountId, linkedAt, proofMethod, isPrimary, canUnlink]
      properties:
        provider: { type: string, enum: [discord, steam, epic] }
        providerAccountId: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        linkedAt: { type: [string, 'null'], format: date-time }
        proofMethod: { type: [string, 'null'] }
        isPrimary: { type: boolean }
        canUnlink:
          type: boolean
          description: >-
            True only when the provider is linked AND unlinking it would still leave at least one
            linked provider (minimumLinkedProviders invariant).
    LinkedIdentitiesResponse:
      type: object
      required: [userId, identities, rules]
      properties:
        userId: { type: string }
        identities:
          type: array
          items: { $ref: '#/components/schemas/LinkedIdentity' }
        rules:
          type: object
          required: [autoMergeByEmailOrName, proofOfControlRequired, minimumLinkedProviders]
          properties:
            autoMergeByEmailOrName: { type: boolean, const: false }
            proofOfControlRequired: { type: boolean, const: true }
            minimumLinkedProviders: { type: integer, const: 1 }
            note: { type: string }
    RecoveryRequest:
      type: object
      required: [provider, providerAccountId]
      properties:
        provider: { type: string, enum: [discord, steam, epic] }
        providerAccountId:
          type: string
          description: The provider-side account id the user claims; existence is never confirmed in the response.
        contactChannel:
          type: [string, 'null']
          description: Optional channel hint for delivering the challenge; never used to auto-merge accounts.
    RecoveryTicket:
      type: object
      required: [status, recoveryTicketId, provider, challengeNonce, expiresAt]
      properties:
        status: { type: string, const: pending_proof_of_control }
        recoveryTicketId: { type: string }
        provider: { type: string, enum: [discord, steam, epic] }
        challengeNonce: { type: string }
        instructions: { type: string }
        expiresAt: { type: string, format: date-time }
    HeartbeatRequest:
      type: object
      required: [playerCount, pluginVersion, buildSha256, arkApiVersion, capabilities, queueDepth, circuitBreakerState]
      properties:
        playerCount: { type: integer }
        pluginVersion: { type: string }
        buildSha256: { type: string }
        arkApiVersion: { type: string }
        capabilities:
          type: array
          items: { type: string }
        queueDepth: { type: integer }
        circuitBreakerState: { type: string }
    DeliveryJob:
      type: object
      required: [deliveryKey, leaseToken, leaseExpiresAt, playerSteamId, deliveryType, payloadHash, payload]
      properties:
        deliveryKey: { type: string }
        leaseToken: { type: string }
        leaseExpiresAt: { type: string, format: date-time }
        playerSteamId: { type: string }
        deliveryType: { type: string }
        payloadHash: { type: string }
        payload: { type: object }
    DeliveryReceipt:
      type: object
      required: [leaseToken, playerSteamId, payloadHash, localJournalReceiptId, outcome, gameTimestamp]
      properties:
        leaseToken: { type: string }
        playerSteamId: { type: string }
        payloadHash: { type: string }
        localJournalReceiptId: { type: string }
        outcome: { type: string, enum: [success] }
        gameTimestamp: { type: string, format: date-time }
    WalletBalance:
      type: object
      required: [currency, accounts, total]
      properties:
        currency: { type: string, const: IC }
        accounts:
          type: object
          additionalProperties: { type: string, pattern: '^-?[0-9]+$' }
        total: { type: string, pattern: '^-?[0-9]+$' }
    WalletEvent:
      type: object
      description: >-
        A posted wallet ledger transaction surfaced to the plugin companion. Superset of the
        `wallet.transaction-posted` event payload (events/) with ADDITIVE server-scoped
        attribution fields `playerSteamId` + `userId`. Consumers must ignore unknown fields.
      required: [eventId, eventType, occurredAt, transactionId, transactionType, entries]
      properties:
        eventId: { type: string }
        eventType: { type: string, const: wallet.transaction.posted }
        occurredAt: { type: string, format: date-time }
        transactionId: { type: string }
        transactionType: { type: string }
        referenceType: { type: [string, 'null'] }
        referenceId: { type: [string, 'null'] }
        playerSteamId:
          type: [string, 'null']
          description: Additive — steamId of the player this event is attributed to on this server.
        userId:
          type: [string, 'null']
          description: Additive — IRIS user id this event is attributed to.
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [accountKey, amount, currency]
            properties:
              accountKey: { type: string }
              amount: { type: string, pattern: '^-?[0-9]+$' }
              currency: { type: string, const: IC }
    LedgerEntry:
      type: object
      required: [id, amount, balanceAfter, account]
      properties:
        id: { type: string }
        amount: { type: string, pattern: '^-?[0-9]+$' }
        balanceAfter: { type: string, pattern: '^-?[0-9]+$' }
        account:
          type: object
          required: [key, type, currency]
          properties:
            key: { type: string }
            type: { type: string }
            currency: { type: string }
    LedgerTransaction:
      type: object
      required: [id, idempotencyKey, type, createdAt, entries]
      properties:
        id: { type: string }
        idempotencyKey: { type: string }
        type: { type: string }
        referenceType: { type: [string, 'null'] }
        referenceId: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Cart:
      type: object
      required: [id, userId, items]
      properties:
        id: { type: string }
        userId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
    CartItem:
      type: object
      required: [id, cartId, productId, serverId, quantity]
      properties:
        id: { type: string }
        cartId: { type: string }
        productId: { type: integer }
        serverId: { type: integer }
        quantity: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        product:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            price: { type: integer }
            itemBlueprint: { type: string }
            quantity: { type: integer }
            quality: { type: integer }
            isBlueprint: { type: boolean }
        server:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            map: { type: [string, 'null'] }
    CheckoutSession:
      type: object
      required: [id, userId, cartSnapshot, totalAmount, status, idempotencyKey, expiresAt]
      properties:
        id: { type: string }
        userId: { type: string }
        cartSnapshot: { type: object }
        totalAmount: { type: string, pattern: '^[0-9]+$' }
        status: { type: string, enum: [pending, completed, expired] }
        idempotencyKey: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        _count:
          type: object
          description: Present on the categories list endpoint.
          properties:
            products: { type: integer }
    Product:
      type: object
      required: [id, name, price, itemBlueprint, quantity, quality, isBlueprint]
      properties:
        id: { type: integer }
        categoryId: { type: [integer, 'null'] }
        name: { type: string }
        description: { type: [string, 'null'] }
        price:
          type: integer
          description: Iris Coin price. Catalog prices are integers; the wallet ledger serializes balances as decimal strings.
        itemBlueprint: { type: string }
        quantity: { type: integer }
        quality: { type: integer, description: '0=Primitive to 5=Ascendant' }
        isBlueprint: { type: boolean }
        imageUrl: { type: [string, 'null'] }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        sortOrder: { type: integer }
        maxPerUser: { type: [integer, 'null'], description: 'null = unlimited' }
        stock: { type: [integer, 'null'], description: 'null = unlimited' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        category:
          oneOf:
            - { $ref: '#/components/schemas/Category' }
            - { type: 'null' }
    ServerStatus:
      type: object
      required: [id, name, isActive, isOnline]
      properties:
        id: { type: integer }
        name: { type: string }
        map: { type: [string, 'null'] }
        isActive: { type: boolean }
        isOnline:
          type: boolean
          description: Derived from lastHeartbeat recency; not a stored column.
        lastHeartbeat: { type: [string, 'null'], format: date-time }
        chatTag: { type: [string, 'null'] }
        chatColor: { type: [string, 'null'] }
        chatIcon: { type: [string, 'null'] }
